# Spooky Stable's release: built on GitHub by the shared FM-1 builder (zvenson/fm1-build@v1), which installs JieLi's
# toolchain and the AC79 SDK, runs ./build.sh and the tests, and signs the package. From fm1-base's template.
#
# Push a tag (git tag v2.0 && git push origin v2.0): the release v2.0 gets spooky-2.0.fwsc.
# Or run it by hand (Actions > Build Spooky Stable > Run workflow): the build's files are in the run's artifacts.
name: Build Spooky Stable

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spooky-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Spooky Stable $version" --generate-notes
          fi

  firmware:
    needs: prepare
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=spooky
        # fm1-base in base/: the submodule if the repository has one, else cloned here at the tested commit
        git submodule update --init --recursive || true
        if [ ! -e base/tools/build.py ]; then
          rm -rf base
          git clone -q https://github.com/charlesvestal/fm1-base base
          git -C base checkout -q b0976f295ccaeaf77a8053a5a785a9cc21f5345f
          git -C base submodule update --init --recursive -q
        fi
        sudo apt-get install -y -qq libfribidi0
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          sh ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
        else
          sh ./build.sh
          cp "app/build/$pkg.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
        fi
        cp app/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        sh tests/run_tests.sh
      packages: build/release-assets/*

  publish:
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
